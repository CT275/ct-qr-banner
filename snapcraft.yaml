name: ct-qr-banner            # technical name: lowercase + hyphens only (no "_"). Change it if already taken
title: CT_QR Banner          # name displayed in the store
base: core22
version: '1.3'
summary: Permanent QR code banner for warehouse pack stations
description: |
  Displays a strip of QR codes at the bottom of the pack station screen,
  so associates can scan them with their 2D scanner.

  - Starts automatically when the user session opens and cannot be closed.
  - Reserves its screen space: maximized windows stop above the banner.
  - Never takes keyboard focus: the scanner keeps typing into the pack tool.
  - No network access: the codes are shipped inside the package (app/codes.txt).
  - Click a QR code to show it full size for 30 seconds.

  Set the station number once with:  ct-qr-banner.table 12
grade: stable
confinement: strict
architectures:
  - build-on: [amd64]

apps:
  ct-qr-banner:
    command: bin/ct-qr-banner
    extensions: [gnome]          # provides GTK 3 + display access (x11, wayland, desktop)
    autostart: ct-qr-banner.desktop
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages
  table:                         # usage: ct-qr-banner.table 12
    command: bin/ct-qr-banner --table
    extensions: [gnome]
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages

parts:
  ct-qr-banner:
    plugin: dump
    source: src
    override-build: |
      craftctl default
      # files uploaded through the GitHub website lose their "executable" flag
      chmod 755 "$CRAFT_PART_INSTALL/bin/ct-qr-banner"
    stage-packages:
      - python3
      - python3-gi
      - gir1.2-gtk-3.0
      - libx11-6
