# =====================================================================
#  CT_QR Banner - settings
#  After editing, the banner restarts by itself (about 10 s).
#  100% local version: no network access.
# =====================================================================

[banner]
# Where the banner sits: bottom, top, left, right
position = bottom

# Size in pixels (height if bottom/top, width if left/right).
# 170 = QR codes of about 3 cm on a 24" screen (readable by the scanner).
# Bigger value = bigger QR codes.
thickness = 170

# Station name shown on the banner, also used to target codes.
# Empty = computer name. Set automatically by the installer (installer.sh 12)
# or by the command: qr-bandeau.table 12
table =

# yes = the banner sits next to existing panels
# (Ubuntu top bar, left dock, DataMatrix panel on the right)
respect_panels = yes

# Show the station name + last update time on the left of the banner
show_header = yes

# Show the team logo (logo.png) above the station name
show_logo = yes

background_color = #1b2a4a
title_color = #ffffff
text_size = 12

# How often (in seconds) the banner re-reads codes.txt and images/
reload_seconds = 30
